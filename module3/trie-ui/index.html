<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autocomplete Trie Web UI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="view.js" type="module"></script>
  </head>
  <body>
    <h1>My Dictionary</h1>
    <div id="container">
      <div id="value-container">
        <input id="value-input" type="text" placeholder="Enter value" />
        <button id="add" class="btn">Add</button>
        <button id="find" class="btn">Find</button>
        <button id="remove" class="btn">Remove</button>
      </div>
      <div id="status-container">
        <p id="status">Status</p>
      </div>
      <div id="autocomplete-container">
        <input
          id="autocomplete-input"
          type="text"
          placeholder="Start typing to see suggestions..."
        />
        <p id="suggestions"></p>
      </div>
      <div id="dictionary-count">
        <h3 id="number">0</h3>
        <p>Words in Dictionary</p>
      </div>
    </div>
  </body>
</html>
