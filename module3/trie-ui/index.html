<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autocomplete Trie Web UI</title>
    <link rel="stylesheet" href="style.css" />
    <script src="view.js" type="module"></script>
  </head>
  <body>
    <h1>Word Finder</h1>
    <div id="container">
      <div id="add-word-container">
        <input type="text" placeholder="Enter a word to add to dictionary" />
        <button id="add-word-btn">Add Word</button>
      </div>
      <div id="status">
        <p>Status</p>
      </div>
      <div id="autocomplete">
        <input type="text" placeholder="Start typing to see suggestions..." />
      </div>
      <div id="dictionary-count">
        <h3 id="number">0</h3>
        <p>Words in Dictionary</p>
      </div>
    </div>
  </body>
</html>
