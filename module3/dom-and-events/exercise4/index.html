<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js"></script>
  </head>
  <body>
    <h1 id="title">My Registration Form</h1>
    <form id="form" action="javascript:void(0);">
      <div id="name" class="input-container">
        <label for="name-input">Name</label>
        <br />
        <input type="text" />
      </div>
      <div id="salary-bday">
        <div id="salary" class="input-container">
          <label for="salary-input">Desired Salary</label>
          <br />
          <input type="number" />
        </div>
        <div id="bday" class="input-container">
          <label for="bday-input">Birthday</label>
          <br />
          <input type="date" value="" />
        </div>
      </div>
      <div id="phone" class="input-container">
        <label for="phone-input">Phone</label>
        <br />
        <input type="tel" />
      </div>
      <div id="submit">
        <button id="submit-btn">Submit</button>
      </div>
    </form>
  </body>
</html>
